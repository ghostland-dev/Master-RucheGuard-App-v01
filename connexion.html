<html><head><base href="https://app.varroaguard.com/connexion">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VarroaGuard - Connexion</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --primary: #FDB813;
  --secondary: #4A4A4A;
  --background: #F5F5F5;
  --error: #dc3545;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--background);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.login-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.login-card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 400px;
  padding: 2rem;
}

.logo-container {
  text-align: center;
  margin-bottom: 2rem;
}

.logo {
  width: 120px;
  height: 120px;
}

.app-title {
  font-size: 1.5rem;
  color: var(--secondary);
  margin: 1rem 0;
  text-align: center;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--secondary);
  font-weight: 500;
}

.form-input {
  width: 100%;
  padding: 0.8rem;
  border: 2px solid #ddd;
  border-radius: 6px;
  font-size: 1rem;
  transition: border-color 0.3s;
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
}

.btn {
  width: 100%;
  padding: 1rem;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-outline {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
  margin-top: 1rem;
}

.divider {
  margin: 1.5rem 0;
  text-align: center;
  position: relative;
}

.divider::before, 
.divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 45%;
  height: 1px;
  background: #ddd;
}

.divider::before {
  left: 0;
}

.divider::after {
  right: 0;
}

.social-login {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-top: 1rem;
}

.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8rem;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  transition: background-color 0.2s;
}

.social-btn:hover {
  background: #f8f9fa;
}

.social-btn i {
  margin-right: 0.5rem;
}

.footer-links {
  text-align: center;
  margin-top: 1.5rem;
}

.footer-link {
  color: var(--secondary);
  text-decoration: none;
  font-size: 0.9rem;
  margin: 0 0.5rem;
}

.footer-link:hover {
  color: var(--primary);
}

/* Animation du logo */
@keyframes float {
  0% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-10px);
  }
  100% {
    transform: translateY(0px);
  }
}

.logo-container svg {
  animation: float 3s ease-in-out infinite;
}

</style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="55" fill="#FDB813" opacity="0.1"/>
          <circle cx="60" cy="60" r="45" fill="#FDB813" opacity="0.2"/>
          <path d="M60 25 C80 25, 95 40, 95 60 C95 80, 80 95, 60 95 C40 95, 25 80, 25 60 C25 40, 40 25, 60 25" 
                fill="#FDB813" stroke="none"/>
          <path d="M60 35 C75 35, 85 45, 85 60 C85 75, 75 85, 60 85 C45 85, 35 75, 35 60 C35 45, 45 35, 60 35" 
                fill="#4A4A4A"/>
          <circle cx="70" cy="50" r="5" fill="white"/>
        </svg>
        <h1 class="app-title">VarroaGuard</h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="votreemail@exemple.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary">Se connecter</button>
        <button type="button" class="btn btn-outline">Créer un compte</button>

        <div class="divider">ou</div>

        <div class="social-login">
          <button type="button" class="social-btn">
            <i class="fab fa-google"></i>
            Google
          </button>
          <button type="button" class="social-btn">
            <i class="fab fa-facebook-f"></i>
            Facebook
          </button>
        </div>

        <div class="footer-links">
          <a href="https://app.varroaguard.com/mot-de-passe-oublie" class="footer-link">Mot de passe oublié ?</a>
          <span>|</span>
          <a href="https://app.varroaguard.com/aide" class="footer-link">Aide</a>
        </div>
      </form>
    </div>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  // Simulation de connexion
  if (email && password) {
    // Animation de chargement pourrait être ajoutée ici
    setTimeout(() => {
      window.location.href = 'https://app.varroaguard.com/ruches';
    }, 1000);
  }
});

// Animation des inputs
const inputs = document.querySelectorAll('.form-input');
inputs.forEach(input => {
  input.addEventListener('focus', function() {
    this.parentElement.classList.add('focused');
  });
  
  input.addEventListener('blur', function() {
    if (!this.value) {
      this.parentElement.classList.remove('focused');
    }
  });
});
</script>
</body></html>
