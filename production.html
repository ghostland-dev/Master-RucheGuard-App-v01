<html><head><base href="https://app.varroaguard.com/production">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VarroaGuard - Production de miel</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #FDB813;
  --secondary: #4A4A4A;
  --background: #F5F5F5;
  --success: #28a745;
  --warning: #ffc107;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--background);
  min-height: 100vh;
  padding: 1rem;
}

.dashboard {
  max-width: 1200px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
}

h1 {
  color: var(--secondary);
  font-size: 1.8rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.stat-title {
  color: var(--secondary);
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.stat-value {
  font-size: 2rem;
  font-weight: bold;
  color: var(--primary);
}

.stat-trend {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.trend-up {
  color: var(--success);
}

.trend-down {
  color: var(--warning);
}

.charts-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.chart-card {
  background: white;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.ruches-list {
  background: white;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.ruche-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid #eee;
}

.ruche-item:last-child {
  border-bottom: none;
}

.ruche-info {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.ruche-status {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.status-good {
  background-color: var(--success);
}

.status-warning {
  background-color: var(--warning);
}

.add-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 0.8rem 1.5rem;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 500;
  transition: opacity 0.2s;
}

.add-btn:hover {
  opacity: 0.9;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .header {
    flex-direction: column;
    gap: 1rem;
    text-align: center;
  }
  
  .stats-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <h1>Production de miel</h1>
      <button class="add-btn">
        <i class="fas fa-plus"></i>
        Nouvelle récolte
      </button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">
          <i class="fas fa-honey-pot"></i>
          Production totale
        </div>
        <div class="stat-value">325 kg</div>
        <div class="stat-trend trend-up">
          <i class="fas fa-arrow-up"></i>
          +15% vs 2022
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-title">
          <i class="fas fa-box"></i>
          Moyenne par ruche
        </div>
        <div class="stat-value">12.5 kg</div>
        <div class="stat-trend trend-up">
          <i class="fas fa-arrow-up"></i>
          +8% vs 2022
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-title">
          <i class="fas fa-calendar"></i>
          Dernière récolte
        </div>
        <div class="stat-value">45 kg</div>
        <div class="stat-trend">15 août 2023</div>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-card">
        <div class="chart-header">
          <h3>Production mensuelle</h3>
        </div>
        <canvas id="productionChart"></canvas>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h3>Production par ruche</h3>
        </div>
        <canvas id="ruchesChart"></canvas>
      </div>
    </div>

    <div class="ruches-list">
      <h3>Dernières récoltes</h3>
      <div class="ruche-item">
        <div class="ruche-info">
          <div class="ruche-status status-good"></div>
          <div>
            <strong>Ruche #12</strong>
            <div>15 kg - 15 août 2023</div>
          </div>
        </div>
        <i class="fas fa-ellipsis-v"></i>
      </div>

      <div class="ruche-item">
        <div class="ruche-info">
          <div class="ruche-status status-good"></div>
          <div>
            <strong>Ruche #08</strong>
            <div>12 kg - 15 août 2023</div>
          </div>
        </div>
        <i class="fas fa-ellipsis-v"></i>
      </div>

      <div class="ruche-item">
        <div class="ruche-info">
          <div class="ruche-status status-warning"></div>
          <div>
            <strong>Ruche #15</strong>
            <div>8 kg - 15 août 2023</div>
          </div>
        </div>
        <i class="fas fa-ellipsis-v"></i>
      </div>
    </div>
  </div>

<script>
// Production mensuelle
const productionCtx = document.getElementById('productionChart').getContext('2d');
new Chart(productionCtx, {
  type: 'line',
  data: {
    labels: ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'],
    datasets: [{
      label: 'Production 2023',
      data: [0, 0, 15, 25, 45, 65, 85, 45, 30, 15, 0, 0],
      borderColor: '#FDB813',
      backgroundColor: 'rgba(253, 184, 19, 0.1)',
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        title: {
          display: true,
          text: 'Production (kg)'
        }
      }
    }
  }
});

// Production par ruche
const ruchesCtx = document.getElementById('ruchesChart').getContext('2d');
new Chart(ruchesCtx, {
  type: 'bar',
  data: {
    labels: ['Ruche #12', 'Ruche #08', 'Ruche #15', 'Ruche #04', 'Ruche #07'],
    datasets: [{
      label: 'Production totale',
      data: [45, 38, 32, 28, 25],
      backgroundColor: '#FDB813',
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        title: {
          display: true,
          text: 'Production (kg)'
        }
      }
    }
  }
});

// Add click handler for the add button
document.querySelector('.add-btn').addEventListener('click', function() {
  // Here you would typically show a modal or navigate to a form
  alert('Fonctionnalité à venir : Ajouter une nouvelle récolte');
});
</script>
</body></html>
